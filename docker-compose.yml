services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cod
      POSTGRES_PASSWORD: cod
      POSTGRES_DB: cod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  pgdata:
